<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Usuário</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="novo-usuario-page">

    <div class="novo-usuario-card">

        <div class="novo-usuario-icone">
            👤
        </div>

        <h1>Cadastrar Usuário</h1>

        <p class="novo-usuario-subtitulo">
            Crie um novo usuário para acessar o sistema.
        </p>

        {% if mensagem %}
            <div class="usuario-sucesso">
                {{ mensagem }}
            </div>
        {% endif %}

        {% if erro %}
            <div class="usuario-erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" class="novo-usuario-form">

            <label>Nome completo</label>
            <input
                type="text"
                name="nome"
                placeholder="Digite o nome completo"
                required
            >

            <label>Usuário</label>
            <input
                type="text"
                name="usuario"
                placeholder="Digite o nome de usuário"
                required
            >

            <label>E-mail</label>
            <input
                type="email"
                name="email"
                placeholder="Digite o e-mail"
                required
            >

            <label>Senha</label>
            <input
                type="password"
                name="senha"
                placeholder="Digite uma senha"
                required
            >

            <button type="submit">
                👤 Cadastrar Usuário
            </button>

        </form>

        <a href="/" class="novo-usuario-voltar">
            ← Voltar para o Dashboard
        </a>

    </div>

</body>

</html>
